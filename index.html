<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ひだかわら版 — 高校生ニュースポータル</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Kaisei+Decol:wght@700&display=swap');

  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Zen Kaku Gothic New', sans-serif;
    background:
      repeating-radial-gradient(circle at 20% 30%, rgba(0,0,0,0.05) 0, rgba(0,0,0,0.05) 1px, transparent 1px, transparent 6px),
      #8a6244;
    color:#2a1c12;
    line-height:1.7;
  }
  .wrap{max-width:900px; margin:0 auto; padding:30px 16px 90px;}

  /* Masthead pinned note */
  .masthead{text-align:center; margin-bottom:8px;}
  .masthead .sub{font-size:11px; letter-spacing:.25em; color:#f0e0c8; margin-bottom:10px;}
  .masthead h1{
    font-family:'Kaisei Decol',serif; font-size:clamp(26px,7vw,42px);
    display:inline-block; background:#fff8ec; color:#2a1c12;
    padding:10px 26px; margin:0; transform:rotate(-1.5deg);
    box-shadow:2px 3px 8px rgba(0,0,0,0.35);
    position:relative;
  }
  .masthead h1::before{
    content:'📌'; position:absolute; top:-14px; left:50%; transform:translateX(-50%); font-size:20px;
  }
  .date-line{
    text-align:center; color:#f6ead4; font-size:12.5px; margin:16px 0 26px;
  }

  /* Week selector */
  .week-select-wrap{ text-align:center; margin-bottom:16px; }
  .week-select-wrap select{
    background:#fdf6e3; color:#2a1c12; border:1px solid #543a26;
    padding:7px 14px; font-size:13px; font-weight:700; font-family:inherit;
    border-radius:3px; box-shadow:1px 2px 5px rgba(0,0,0,0.25);
  }

  /* Category tabs (main 6) */
  .cat-tabs{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:22px;
  }
  .cat-tabs button{
    background:#6f4c33; color:#f6ead4; border:1px solid #543a26;
    padding:8px 14px; font-size:13px; font-weight:700; cursor:pointer;
    border-radius:3px; font-family:inherit;
  }
  .cat-tabs button.active{background:#fdf6e3; color:#2a1c12; border-color:#fdf6e3;}

  /* Sub tag filter (only shown for 進路 category) */
  .tag-filter{
    display:none; flex-wrap:wrap; gap:6px; justify-content:center;
    margin-bottom:22px;
  }
  .tag-filter.show{display:flex;}
  .tag-filter button{
    background:transparent; color:#f6ead4; border:1px solid #f6ead4;
    padding:4px 11px; font-size:11.5px; cursor:pointer; border-radius:20px; font-family:inherit;
  }
  .tag-filter button.active{background:#c9432f; border-color:#c9432f; color:#fff;}
  .tag-filter select{
    background:#fdf6e3; color:#2a1c12; border:1px solid #543a26;
    padding:5px 12px; font-size:12px; font-weight:700; font-family:inherit;
    border-radius:20px;
  }

  /* Cork board grid */
  .board{
    display:grid;
    grid-template-columns:1fr;
    gap:16px;
  }
  @media(min-width:640px){ .board{grid-template-columns:1fr 1fr;} }

  .note{
    background:#fdf6e3; padding:15px 17px;
    box-shadow:2px 3px 10px rgba(0,0,0,0.3);
    transform:rotate(var(--r,-0.6deg));
    position:relative;
  }
  .note:nth-child(3n){--r:0.7deg;}
  .note:nth-child(3n+1){--r:-1deg;}
  .note:nth-child(3n+2){--r:0.3deg;}
  .note::before{
    content:'📍'; position:absolute; top:-10px; left:14px; font-size:16px;
  }
  .note .tag{
    display:inline-block; font-size:10px; font-weight:700; background:#c9432f; color:#fff;
    padding:2px 8px; margin-bottom:8px;
  }
  .note.editorial{background:#f5efe0;}
  .note.editorial::before{content:'🖋️';}
  .note.editorial .tag{background:#2a3d66;}
  .note.editorial .source{font-size:10px; color:#5c4a38; font-weight:700; margin-bottom:4px;}
  .note h3{font-size:15px; margin:0 0 6px; font-weight:700; line-height:1.45;}
  .note h3 a{color:#2a1c12; text-decoration:none;}
  .note h3 a:hover{text-decoration:underline;}
  .note p{margin:0 0 6px; font-size:12px; color:#5c4a38;}
  .note .meta{font-size:10.5px; color:#8a7660;}

  .empty{
    text-align:center; color:#f6ead4; font-size:13px; padding:40px 0; grid-column:1/-1;
  }

  /* Breaking news banner (up to 3 items, stacked) */
  .breaking-wrap{ margin-bottom:22px; display:flex; flex-direction:column; gap:6px; }
  .breaking-wrap.hide{ display:none; }
  .breaking-banner{
    background:#c9432f; color:#fff;
    padding:10px 14px;
    box-shadow:2px 3px 10px rgba(0,0,0,0.3);
    display:flex; align-items:flex-start; gap:10px;
  }
  .breaking-banner .bmark{
    background:#fff; color:#c9432f; font-weight:900; font-size:11px;
    padding:2px 8px; flex-shrink:0; margin-top:2px;
  }
  .breaking-banner .btext a{color:#fff; text-decoration:underline; font-weight:700; font-size:13.5px;}
  .breaking-banner .btext p{margin:4px 0 0; font-size:11.5px; opacity:0.9;}
  .breaking-banner .btext .bmeta{font-size:10px; opacity:0.75; margin-top:4px;}

  footer{text-align:center; font-size:11px; color:#f0e0c8; margin-top:40px; letter-spacing:.08em;}
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div class="sub">DAILY SCHOOL EDITION</div>
    <h1>ひだかわら版</h1>
  </div>

  <div class="breaking-wrap hide" id="breakingWrap"></div>

  <div class="week-select-wrap">
    <select id="weekSelect"></select>
  </div>

  <div class="cat-tabs" id="catTabs"></div>
  <div class="tag-filter" id="tagFilter"></div>
  <div class="board" id="board"></div>

  <footer>ひだかわら版・高校生ニュースポータル</footer>
</div>

  const BREAKING = [
    {category:"社会・ビジネス系", career_tag:"", tag:"速報", breaking:true, posted:"2026-09-05", title:"台風24号、沖縄付近を南下し次第に勢力弱まる見込み 九州も引き続き警戒", summary:"台風24号は9月5日12時時点で久米島の北北東約90kmを南へ進行中。今後は南大東島付近へ向かい、9日ごろには熱帯低気圧に変わって九州の南に達する見通し。沖縄から九州にかけて土砂災害や大雨への警戒が引き続き必要となっている。", url:"https://tenki.jp/bousai/typhoon/2624/", date:"9/5"},
    {category:"社会・ビジネス系", career_tag:"", tag:"速報", breaking:true, posted:"2026-09-03", title:"台風24号「クロヴァン」、沖縄付近で来週にかけ迷走のおそれ 大雨長期化に警戒", summary:"台風24号は9月3日9時時点で南大東島の北北西約90kmを北上中。4日朝には沖縄・奄美に接近する見通しだが、その後は高気圧に行く手を阻まれて沖縄付近に長く留まる可能性があり、鹿児島・宮崎では線状降水帯発生のおそれも。秋雨前線の影響も重なり、広い範囲で大雨が長期化するとして警戒が呼びかけられている。", url:"https://weathernews.jp/news/202609/030111/", date:"9/3"},
    {category:"社会・ビジネス系", career_tag:"", tag:"速報", breaking:true, posted:"2026-09-03", title:"台風24号「クロヴァン」、3日午後に沖縄本島へ接近 その後も進路複雑化のおそれ", summary:"台風24号は9月3日3時時点で南大東島の南方約140kmを北北西に進行中。同日午後には沖縄本島・奄美に接近し、強雨・強風・高波への警戒が必要。その後は上空の風が弱まり、北上と南下を繰り返す複雑な進路をたどる可能性があり、秋雨前線の影響で西日本から東日本にかけて大雨となるおそれもある。", url:"https://weathernews.jp/news/202609/030031/", date:"9/3"},
    {category:"社会・ビジネス系", career_tag:"", tag:"速報", breaking:true, posted:"2026-09-02", title:"台風24号「クロヴァン」、進路複雑化のおそれ 西日本〜東日本は4日ごろ大雨警戒", summary:"台風24号は9月2日9時時点で日本の南をゆっくり北上中。4日ごろまでは太平洋高気圧の縁に沿って北上する見通しだが、その後は東西の高気圧に挟まれて進路が複雑になる可能性がある。秋雨前線に湿った空気が流れ込み雨雲が発達することで、西日本から東日本の広い範囲で4日ごろを中心に大雨となるおそれがある。", url:"https://weathernews.jp/news/202609/020121/", date:"9/2"},
    {category:"社会・ビジネス系", career_tag:"", tag:"速報", breaking:true, posted:"2026-09-01", title:"台風24号「クロヴァン」、2日に南大東島付近へ 関東〜四国は3〜5日に大雨警戒", summary:"日本の南でほぼ停滞していた台風24号は、9月2日15時ごろに南大東島の南南東約200kmに達し、4日には奄美群島近海まで北上する見通し。動きが遅く、秋雨前線の影響も重なることで、3〜5日ごろにかけて関東から四国を中心に広い範囲で大雨となるおそれがあるとして、早めの備えが呼びかけられている。", url:"https://tenki.jp/bousai/typhoon/2624/", date:"9/1"}
  ];

/* =====================================================================
   記事データ(ここを毎朝更新する) — 週ごとのアーカイブ構造
   ---------------------------------------------------------------------
   ・WEEKS は週ごとの配列。一番最後(最新)の週の articles に、
     毎朝その日の記事を「追記」していく(置き換えない)。
   ・土曜日になったら、WEEKS の末尾に新しい週オブジェクトを追加する。
     label は「8/22〜8/28」のように土曜〜金曜の日付範囲を書く。
   ・毎朝、Claudeとのチャットでその日のニュースを検索してもらい、
     articles と同じ形式のJSONブロックを生成してもらう。
     生成されたブロックを最新週の articles 配列の末尾に貼り足すだけでOK。
   ・category は以下の5つのいずれか:
       "医療・健康系" | "教育・保育系" | "社会・ビジネス系" | "実技・専門系" | "社説"
   ・career_tag は分野ごとの専門タグ(該当すれば付ける、一般ニュースは省略可):
       医療・健康系: 看護/作業療法/理学療法/臨床検査/栄養
       教育・保育系: 教育/保育
       社会・ビジネス系: 法学/経済/経営/国際関係/福祉
       実技・専門系: スポーツ科学/美容/調理

   【速報(breaking news)について】
   ・速報として載せたい記事には breaking:true と posted:"YYYY-MM-DD"(掲載日、
     ISO形式)を付ける。掲載日から3日経過すると画面上に自動的に表示されなくなる
     (データからは消えないが、非表示になる)。
     例: {category:"社会・ビジネス系", career_tag:"経済", tag:"速報", breaking:true,
          posted:"2026-08-25", title:"...", summary:"...", url:"...", date:"8/25"}
   ・速報でない通常記事・社説には breaking/posted は付けなくてよい(その場合は
     何日経っても表示され続ける)。

   【社説・ニュース収集について】

     各社の社説へのリンクを日付順にまとめている。全国紙だけでなくブロック紙・地方紙
     も積極的に対象に含める(和歌山の地方紙「紀伊民報」は独自の社説ページがshasetsu.jp
     上で見つからない場合があるので、その際は近隣の京都新聞・神戸新聞・奈良新聞など
     関西のブロック紙・地方紙で代替してよい)。天声人語などの「1面コラム」は各紙とも
     有料会員限定化が進んでいるが、「社説」欄はコラムとは別枠で、全国紙・ブロック紙・
     地方紙いずれも基本的に無料で読める(読売・京都新聞は直接確認済み。他紙は環境の都合上
     逐一のアクセス確認はできないことが多いが、一般に社説は無料公開区分のため採用可)。
     もし特定の記事が有料壁に当たっていることが分かった場合は、その記事は除外する。
   ・採用した記事は、内容に応じて「社説」枠と、4分野(医療・健康系/教育・保育系/
     社会・ビジネス系/実技・専門系)の通常ニュース、どちらか一方または両方に載せる:
       - 社説として読ませたい論説記事 → category:"社説", editorial:true,
         source:"〇〇新聞 社説"(実際の新聞社名), tag:"社説"
       - 分野に関連する時事ニュースとしても使える内容 → 該当分野に通常記事として
         重複掲載(この場合は editorial/source を付けず、通常のtag/career_tagを使う)
       - 社説以外でも、shasetsu.jp経由で見つけた無料記事が単に良質なニュースであれば、
         通常のニュース記事として該当分野にそのまま載せてよい(社説枠は必須ではない)
   ・出典は必ず新聞社の公式サイトのURLをそのまま使う(shasetsu.jpのURLではない)。
   ・新しい記事は必ず articles 配列の末尾に追加すること(画面側で自動的に新しい
     ものほど上に表示される仕組みになっている)。
   ===================================================================== */

        {category:"教育・保育系", career_tag:"保育", tag:"保育・教育", title:"保育士の配置基準改善、1歳児加算の運用が本格化", summary:"1歳児は5人に1人体制への加算が広がりつつあるが、実施率は自治体差も。", url:"https://ichitasu.co.jp/hoikushi-haichi", date:"7/1"},

        {category:"医療・健康系", tag:"医薬品行政", title:"コロナワクチン接種の健康被害、新たに3件を認定 厚労省審査分科会", summary:"厚生労働省の予防接種健康被害審査分科会は新型コロナワクチンに関する28件の申請を審議し、3件を認定、25件を否認した。認定分の内訳は医療費・医療手当の請求が2件、障害年金が1件。", url:"https://www.cbnews.jp/news/entry/20260904155411", date:"9/4"},

        {category:"医療・健康系", career_tag:"看護", tag:"地域医療", title:"名古屋市の聖霊病院、藤田学園へ事業承継の準備進む", summary:"社会福祉法人聖霊会は名古屋市の聖霊病院(194床)と訪問看護ステーションの事業を学校法人藤田学園へ承継する準備を進めていると発表。1945年開院の同病院の医療提供体制を維持し、地域医療を継続することが目的とされる。", url:"https://www.cbnews.jp/news/entry/20260903124807", date:"9/3"},

        {category:"社会・ビジネス系", career_tag:"経済", tag:"経済", title:"日経平均、5日ぶり反発 前日比806円高の6万5020円で終値", summary:"9月4日の東京株式市場で日経平均株価は5日ぶりに反発し、前日比806.46円高の6万5020.94円で取引を終えた。日米の長期金利上昇が一服したことが追い風となった。", url:"https://jp.investing.com/news/forex-news/article-1670423", date:"9/4"},

        {category:"実技・専門系", career_tag:"美容", tag:"美容", title:"世界最高齢の現役理容師、箱石シツイさん逝去 109歳", summary:"栃木県那珂川町の箱石シツイさんが9月1日に109歳で逝去した。世界最高齢の女性現役理容師として知られ、2021年には104歳で東京五輪の聖火ランナーを務め、2025年にギネス世界記録に認定されていた。", url:"https://ribiyo-news.jp/?p=51417", date:"9/4"},

        {category:"実技・専門系", career_tag:"美容", tag:"美容", title:"岩谷学園横浜美容専門学校が作品発表会「Metamorphosis 2026」開催", summary:"岩谷学園横浜美容専門学校で、トータルビューティー科・ビューティースタイリスト科の学生による作品発表会が開催され、「変化」をテーマにヘアとファッションで2年間の学びの成果を披露した。", url:"https://ribiyo-news.jp/?p=51419", date:"9/4"}
      ]
    }
  ];

  const CATEGORIES = ["医療・健康系","教育・保育系","社会・ビジネス系","実技・専門系","社説"];
  const CAREER_TAGS = {
    "医療・健康系": ["看護","作業療法","理学療法","臨床検査","栄養"],
    "教育・保育系": ["教育","保育"],
    "社会・ビジネス系": ["法学","経済","経営","国際関係","福祉"],
    "実技・専門系": ["スポーツ科学","美容","調理"]
  };
  let state = {weekIndex: WEEKS.length - 1, category:CATEGORIES[0], careerTag:null, editorialDate:null};

  // breaking news banner (shows up to the newest 3 items)
  if(BREAKING.length > 0){
    const wrap = document.getElementById('breakingWrap');
    wrap.classList.remove('hide');
    wrap.innerHTML = BREAKING.slice(0, 3).map(b => `
      <div class="breaking-banner">
        <div class="bmark">速報</div>
        <div class="btext">
          <a href="${b.url}" target="_blank" rel="noopener">${b.title}</a>
          <p>${b.summary}</p>
          <div class="bmeta">${b.date}</div>
        </div>
      </div>
    `).join('');
  }

  // week selector
  const weekSelect = document.getElementById('weekSelect');
  weekSelect.innerHTML = WEEKS.map((w,i) =>
    `<option value="${i}" ${i===state.weekIndex?'selected':''}>${w.label}${i===WEEKS.length-1?'(今週)':''}</option>`
  ).reverse().join('');
  weekSelect.addEventListener('change', e=>{
    state.weekIndex = Number(e.target.value);
    state.careerTag = null;
    state.editorialDate = null;
    render();
  });

  // date
  const today = new Date();
  const days=['日','月','火','水','木','金','土'];
  document.getElementById('dateLine').textContent =
    `${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日(${days[today.getDay()]}) 更新`;

  // 速報(breaking news) auto-expiry: items with breaking:true and a posted:"YYYY-MM-DD"
  // date are hidden once 3 days have passed since that date.
  function isExpiredBreaking(a){
    if(!a.breaking || !a.posted) return false;
    const posted = new Date(a.posted + "T00:00:00");
    const diffDays = (today - posted) / (1000*60*60*24);
    return diffDays >= 3;
  }

  // category tabs
  const catTabs = document.getElementById('catTabs');
  catTabs.innerHTML = CATEGORIES.map(c =>
    `<button data-cat="${c}" class="${c===state.category?'active':''}">${c}</button>`
  ).join('');
  catTabs.addEventListener('click', e=>{
    if(e.target.tagName!=='BUTTON') return;
    state.category = e.target.dataset.cat;
    state.careerTag = null;
    state.editorialDate = null;
    catTabs.querySelectorAll('button').forEach(b=>b.classList.toggle('active', b.dataset.cat===state.category));
    render();
  });

  function render(){
    const weekArticles = WEEKS[state.weekIndex].articles;

    // tag filter (career sub-fields per category, or a date dropdown for 社説)
    const tagFilter = document.getElementById('tagFilter');
    if(state.category === "社説"){
      const dates = [...new Set(weekArticles.filter(a => a.category === "社説").map(a => a.date))];
      tagFilter.classList.add('show');
      tagFilter.innerHTML = `<select id="editorialDateSelect">
          <option value="__all">すべての日付</option>
          ${dates.map(d => `<option value="${d}" ${state.editorialDate===d?'selected':''}>${d}</option>`).join('')}
        </select>`;
    } else {
      const tags = CAREER_TAGS[state.category] || [];
      if(tags.length === 0){
        tagFilter.classList.remove('show');
        tagFilter.innerHTML = '';
      } else {
        tagFilter.classList.add('show');
        tagFilter.innerHTML = `<button data-tag="__all" class="${!state.careerTag?'active':''}">すべて</button>` +
          tags.map(t => `<button data-tag="${t}" class="${state.careerTag===t?'active':''}">${t}</button>`).join('');
      }
    }

    // board
    const board = document.getElementById('board');
    let items = weekArticles.filter(a => a.category === state.category && !isExpiredBreaking(a)).reverse();
    if(state.category === "社説"){
      if(state.editorialDate){
        items = items.filter(a => a.date === state.editorialDate);
      }
    } else if(state.careerTag){
      items = items.filter(a => a.career_tag === state.careerTag);
    }
    if(items.length === 0){
      board.innerHTML = `<div class="empty">この分野の記事はまだありません。</div>`;
      return;
    }
    board.innerHTML = items.map(a => `
      <div class="note${a.editorial ? ' editorial' : ''}">
        <span class="tag">${a.tag}</span>
        ${a.editorial ? `<div class="source">${a.source || ''}</div>` : ''}
        <h3><a href="${a.url}" target="_blank" rel="noopener">${a.title}</a></h3>
        <p>${a.summary}</p>
        <div class="meta">${a.date}更新</div>
      </div>
    `).join('');
  }

  document.getElementById('tagFilter').addEventListener('click', e=>{
    if(e.target.tagName!=='BUTTON') return;
    state.careerTag = e.target.dataset.tag === '__all' ? null : e.target.dataset.tag;
    render();
  });

  document.getElementById('tagFilter').addEventListener('change', e=>{
    if(e.target.id !== 'editorialDateSelect') return;
    state.editorialDate = e.target.value === '__all' ? null : e.target.value;
    render();
  });

  render();
</script>
</body>
</html>
